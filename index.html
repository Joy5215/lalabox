<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07060D">
<title>LALABOX · 哼两句，就成歌</title>
<script src="https://s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
</head>
<body>

<div class="bg"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <h1>LALABOX</h1>
      <p>哼两句，就成歌</p>
    </div>
    <button class="ghost" id="btnWorks">我的作品</button>
  </header>

  <main class="stage">
    <!-- 开场 -->
    <section class="screen active" data-screen="idle">
      <div class="idle-wrap">
        <button class="mic" id="btnMic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <rect x="9" y="2.5" width="6" height="11" rx="3"></rect>
            <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5M8.5 21.5h7"></path>
          </svg>
          <span id="micLabel">开始唱</span>
        </button>
        <p class="idle-title">点我，唱一小段</p>
        <p class="idle-sub">跟着节拍随便哼 8 拍<br>剩下的鼓、贝斯、和弦交给我</p>
        <ol class="steps"><li class="on">唱</li><li>听</li><li>成曲</li></ol>
      </div>
    </section>

    <!-- 录音 -->
    <section class="screen" data-screen="record">
      <div class="rec-wrap">
        <div class="beat-lights" id="beatLights"><i></i><i></i><i></i><i></i></div>
        <div class="rec-stage">
          <canvas id="cvRec"></canvas>
          <div class="rec-count" id="recCount">4</div>
        </div>
        <div class="rec-hint" id="recHint">准备好，跟着「哒」开始哼</div>
        <div class="level" id="levelWrap"><i id="levelBar"></i></div>
      </div>
    </section>

    <!-- 结果 -->
    <section class="screen" data-screen="result">
      <div class="result-head">
        <div class="badges">
          <span class="badge" id="badgeKey">A 小调</span>
          <span class="badge alt" id="badgeBpm">96 BPM</span>
        </div>
        <button class="ghost" id="btnRedo">重录</button>
      </div>
      <div class="panes">
        <div class="panel">
          <div class="panel-title"><b>你的哼唱</b><span>它听成了这样</span></div>
          <canvas id="cvMelody"></canvas>
        </div>
        <div class="panel">
          <div class="panel-title"><b>你的乐队</b><span>自动配的伴奏</span></div>
          <canvas id="cvBand"></canvas>
        </div>
      </div>
      <div class="styles" id="styleChips"></div>
      <div class="scan">
        <div class="scan-ring"></div>
        <div class="scan-text" id="scanText">正在听你的音高…</div>
        <div class="scan-bar"><i id="scanBar"></i></div>
      </div>
    </section>
  </main>

  <footer class="dock">
    <div class="dock-group" data-dock="idle">
      <button class="link" id="btnSample">没麦克风？听听示例</button>
      <span class="hint">戴耳机更好听</span>
    </div>
    <div class="dock-group hide" data-dock="record">
      <button class="btn primary wide" id="btnStopRec">停止</button>
    </div>
    <div class="dock-group hide" data-dock="result">
      <button class="round" id="btnPlay" aria-label="播放">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10.6-6.8c.6-.4.6-1.4 0-1.8L9.6 4.3c-.7-.4-1.6.1-1.6.9z"/></svg>
      </button>
      <button class="btn soft" id="btnSave">存下来</button>
      <button class="btn soft" id="btnShare">分享</button>
      <button class="btn soft" id="btnPoster">海报</button>
    </div>
  </footer>
</div>

<!-- 作品库 -->
<div class="sheet" id="sheetWorks">
  <div class="sheet-body">
    <div class="sheet-head"><h3>我的作品</h3><button class="x" data-close>✕</button></div>
    <div class="works" id="worksList"></div>
  </div>
</div>

<!-- 保存 -->
<div class="sheet" id="sheetSave">
  <div class="sheet-body">
    <div class="sheet-head"><h3>存下这一首</h3><button class="x" data-close>✕</button></div>
    <div class="field">
      <label>给它起个名字</label>
      <input id="saveName" type="text" maxlength="16" autocomplete="off" spellcheck="false">
    </div>
    <button class="btn primary wide" id="btnSaveConfirm" style="max-width:none">保存</button>
  </div>
</div>

<!-- 分享 -->
<div class="sheet" id="sheetShare">
  <div class="sheet-body">
    <div class="sheet-head"><h3>分享给朋友</h3><button class="x" data-close>✕</button></div>
    <div class="qrbox">
      <img id="qrImg" alt="二维码">
      <p>扫码打开，直接听同一首<br>对方不用装任何东西</p>
    </div>
    <button class="btn primary wide" id="btnShareSys" style="max-width:none">用 B 站分享</button>
  </div>
</div>

<!-- 海报 -->
<div class="sheet" id="sheetPoster">
  <div class="sheet-body">
    <div class="sheet-head"><h3>作品海报</h3><button class="x" data-close>✕</button></div>
    <canvas id="posterCv"></canvas>
    <button class="btn primary wide" id="btnPosterSave" style="max-width:none">保存到相册</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/core/utils.js"></script>
<script src="js/core/bridge.js"></script>
<script src="js/music/arrange.js"></script>
<script src="js/music/codec.js"></script>
<script src="js/music/analyze.js"></script>
<script src="js/music/compose.js"></script>
<script src="js/audio/engine.js"></script>
<script src="js/ui/draw.js"></script>
<script src="js/app.js"></script>
</body>
</html>
